<svg
    width="700"
    height="180"
    viewBox="0 0 700 180"
    xmlns="http://www.w3.org/2000/svg">

<defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1DB954"/>
        <stop offset="100%" stop-color="#191414"/>
    </linearGradient>

    <clipPath id="cover">
        <rect x="25" y="25" width="130" height="130" rx="12"/>
    </clipPath>
</defs>

<rect
    width="700"
    height="180"
    rx="20"
    fill="url(#bg)"
/>


<image
    x="25"
    y="25"
    width="130"
    height="130"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#cover)"
    href="https://i.scdn.co/image/ab67616d0000b273fa5ffe4cf0219945ce4c0b8d"
/>


<text
    x="180"
    y="55"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="bold"
    fill="#ffffff"
    opacity="0.8">
    NOW PLAYING
</text>

<text
    x="180"
    y="90"
    font-family="Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="bold"
    fill="#ffffff">
    Make a Wish
</text>

<text
    x="180"
    y="120"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    fill="#ffffff"
    opacity="0.9">
    Beedie
</text>

<text
    x="180"
    y="148"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#ffffff"
    opacity="0.65">
    Counter Culture
</text>

<circle
    cx="650"
    cy="35"
    r="12"
    fill="#1DB954"
/>

<circle
    cx="650"
    cy="35"
    r="5"
    fill="#ffffff"
/>

</svg>
