name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # Every day
  workflow_dispatch:


  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Install Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python packages
      - name: Install dependencies
        run: pip install requests
      - name: Generate stats
        run: |
          # Run your script here
          # python generate_top_langs.py
          python generate_svg.py
          python generate_streak.py
          python generate-profile-views.py
          python generate-followers-badge.py
          python generate-stars-badge.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update GitHub stats"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
