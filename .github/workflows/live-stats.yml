name: Live Stats

# Regenerates the "Live Monitoring" SVG so the README updates on its own.
on:
  schedule:
    - cron: "0 * * * *"   # every hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live-monitor SVG
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/live-monitor.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh live monitor [skip ci]"
            git push
          fi
