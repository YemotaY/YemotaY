<svg xmlns="http://www.w3.org/2000/svg"
width="900"
height="260">

<defs>

<filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="8"
    flood-color="#00ffe7"
    flood-opacity="0.35"/>
</filter>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#161b22"/>
</linearGradient>

<style>
text {
fill:white;
font-family:Arial;
}

.card {
animation: float 4s ease-in-out infinite;
}

.card2 {
animation-delay:.5s;
}

.card3 {
animation-delay:1s;
}

@keyframes float {
0% {transform:translateY(0px)}
50% {transform:translateY(-8px)}
100% {transform:translateY(0px)}
}

.avatar {
filter:url(#shadow);
}

</style>

</defs>

<rect width="100%" height="100%" fill="url(#bg)" rx="20"/>

<text x="350" y="45"
font-size="28"
font-weight="bold">
Latest Frens:
</text>

<g class="card card1">
    <circle
        class="avatar"
        cx="150"
        cy="130"
        r="45"
        fill="#222"/>

    <image
        href="data:image/png;base64,"
        x="105"
        y="85"
        width="90"
        height="90"
        clip-path="circle(45px at 45px 45px)"
    />

    <text
        x="150"
        y="205"
        text-anchor="middle"
        font-size="16">
        @Anton-Sergeev-EA
    </text>
</g>

<g class="card card2">
    <circle
        class="avatar"
        cx="450"
        cy="130"
        r="45"
        fill="#222"/>

    <image
        href="data:image/png;base64,"
        x="405"
        y="85"
        width="90"
        height="90"
        clip-path="circle(45px at 45px 45px)"
    />

    <text
        x="450"
        y="205"
        text-anchor="middle"
        font-size="16">
        @Alizjahan
    </text>
</g>

<g class="card card3">
    <circle
        class="avatar"
        cx="750"
        cy="130"
        r="45"
        fill="#222"/>

    <image
        href="data:image/png;base64,"
        x="705"
        y="85"
        width="90"
        height="90"
        clip-path="circle(45px at 45px 45px)"
    />

    <text
        x="750"
        y="205"
        text-anchor="middle"
        font-size="16">
        @Sunil56224972
    </text>
</g>
</svg>