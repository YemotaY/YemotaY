    L785 93 L756 128 L720 158
    L675 151 L640 178 L600 181 Z" fill="#587582" opacity=".92"/>
  <path d="
    M1080 116 L1160 88 L1240 105 L1320 73
    L1390 92 L1350 123 L1300 137
