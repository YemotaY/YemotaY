    C730 192 860 211 1030 198
    C1220 185 1430 207 1600 190
    L1600 252 L0 252 Z" fill="#829ba1" opacity=".65"/>
<!--EISMEER / EBENE-->
  <rect x="0" y="215" width="1600" height="685" fill="url(#ice)"/>
<!--Horizontale Eislinien-->
  <g fill="none" stroke-linecap="round">
    <path d="M0 337 C210 326 390 348 600 337 S1030 325 1600 341" stroke="#b8c8c9" stroke-width="4" opacity=".45"/>
    <path d="M0 406 C260 395 430 420 690 408 S1160 396 1600 413" stroke="#879fa5" stroke-width="5" opacity=".28"/>
    <path d="M0 459 C170 447 360 475 560 462 S970 448 1600 467" stroke="#d0dbda" stroke-width="7" opacity=".5"/>
    <path d="M0 518 C190 505 390 529 590 516 S1010 504 1600 522" stroke="#839da3" stroke-width="4" opacity=".3"/>
    <path d="M0 575 C210 559 420 586 670 571 S1160 563 1600 580" stroke="#c9d7d6" stroke-width="8" opacity=".55"/>
    <path d="M0 643 C180 625 390 657 610 642 S1090 628 1600 647" stroke="#819aa0" stroke-width="5" opacity=".35"/>
    <path d="M0 708 C230 695 410 723 650 706 S1160 695 1600 714" stroke="#d1dcdc" stroke-width="7" opacity=".58"/>
  </g>
<!--Eisrücken-->
  <g fill="none" stroke-linecap="round">
    <path d="M0 487 C55 475 84 482 130 489
             C175 496 220 483 270 488
             C320 494 355 483 405 490" stroke="#dce5e4" stroke-width="11" opacity=".65"/>
    <path d="M470 550 C530 534 590 545 642 539
             C700 533 745 549 800 540
             C860 530 925 547 980 540" stroke="#dce5e4" stroke-width="13" opacity=".7"/>
    <path d="M1020 625 C1080 613 1135 627 1190 617
             C1250 607 1320 622 1380 613
             C1450 603 1510 618 1600 608" stroke="#dce5e4" stroke-width="12" opacity=".65"/>
    <path d="M0 739 C120 728 205 746 310 735
             C400 726 475 742 570 731" stroke="#dbe4e3" stroke-width="14" opacity=".72"/>
  </g>
<!--kleine Eisbrocken-->
  <g fill="#d4dfde" opacity=".85">
    <path d="M95 535 l18 -13 24 7 9 16 -31 7 -25 -8z"/>
    <path d="M340 708 l20 -17 26 9 8 17 -29 10 -28 -6z"/>
    <path d="M850 555 l25 -15 28 10 8 15 -35 10 -28 -8z"/>
    <path d="M1110 632 l18 -16 24 6 8 18 -27 8z"/>
    <path d="M1450 742 l22 -13 31 8 6 15 -34 9z"/>
  </g>
<!--ATMOSPHÄRISCHE HORIZONT-SCHICHT-->
  <rect x="0" y="200" width="1600" height="180" fill="url(#mist)"/>
<!--COZY WALKING PENGUIN — BACK VIEW, STAYS ON THE SPOT-->
  <g id="penguin" transform="translate(660 700)">
<!--soft stationary shadow-->
    <ellipse cx="0" cy="20" rx="25" ry="6" fill="#566e74" opacity=".28">
      <animate attributeName="rx" values="24;27;24" dur="0.75s" repeatCount="indefinite"/>
    </ellipse>
<!--entire penguin gently bobs, but NEVER travels-->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 -3; 0 0" dur="0.75s" repeatCount="indefinite"/>
<!--LEFT LEG-->
      <g>
        <path d="
    M-7 3
    L-9 18
    L-16 15" fill="none" stroke="#18272a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
<!--RIGHT LEG-->
      <g>
        <path d="
    M7 3
    L9 18
    L16 15" fill="none" stroke="#18272a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
<!--BODY / BACK-->
      <path d="
      M-13 -10
      C-17 -23 -15 -40 -7 -49
      C-2 -55 7 -55 13 -49
      C21 -40 22 -23 15 -10
      C11 0 7 9 1 10
      C-6 10 -11 1 -13 -10 Z" fill="#10191c"/>
<!--subtle dark-blue back highlight-->
      <path d="
      M-8 -38
      C-4 -48 5 -51 11 -44
      C15 -37 16 -25 13 -16
      C10 -8 7 -3 2 1
      C-2 -4 -7 -12 -8 -22 Z" fill="#1c2c31" opacity=".65"/>
<!--BACK OF HEAD-->
      <ellipse cx="0" cy="-48" rx="13" ry="12" fill="#0b1417"/>
<!--tiny soft head highlight-->
      <ellipse cx="-3" cy="-52" rx="5" ry="3" fill="#26383c" opacity=".6"/>
<!--LEFT FLIPPER-->
      <g>
        <path d="
        M-13 -34
        C-23 -29 -27 -17 -25 -7
        C-24 -2 -20 1 -17 -4
        C-13 -12 -10 -22 -9 -30 Z" fill="#091215">
          <animateTransform attributeName="transform" type="rotate" values="90 -13 -30; 97 -13 -30; 90 -13 -30; 85 -13 -30; 90 -13 -30" dur="0.75s" repeatCount="indefinite"/>
        </path>
      </g>
<!--RIGHT FLIPPER-->
      <g>
        <path d="
        M13 -34
        C23 -29 27 -17 25 -7
        C24 -2 20 1 17 -4
        C13 -12 10 -22 9 -30 Z" fill="#091215">
          <animateTransform attributeName="transform" type="rotate" values="-90 13 -30; -83 13 -30; -90 13 -30; -95 13 -30; -90 13 -30" dur="0.75s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
<!--Vordergrund leichte Nebel-/Schneeschicht-->
  <path d="
    M0 790
    C240 770 390 805 610 789
    C850 772 1080 805 1280 787
    C1430 775 1520 789 1600 780
    L1600 900 L0 900 Z" fill="#a4b8bb" opacity=".25"/>
</svg>
