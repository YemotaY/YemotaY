<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
<!--Himmel-->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#718d98"/>
      <stop offset="55%" stop-color="#9db3b8"/>
      <stop offset="100%" stop-color="#b6c6c8"/>
    </linearGradient>
<!--Ferne Berge-->
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e1df"/>
      <stop offset="45%" stop-color="#839ba5"/>
      <stop offset="100%" stop-color="#627f8a"/>
    </linearGradient>
    <linearGradient id="mountainDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9eafb3"/>
      <stop offset="100%" stop-color="#526e7b"/>
    </linearGradient>
<!--Eisfläche-->
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb4b8"/>
      <stop offset="45%" stop-color="#a9bec1"/>
      <stop offset="100%" stop-color="#91a8ad"/>
    </linearGradient>
<!--leichter atmosphärischer Dunst-->
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3dddd" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#d3dddd" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
<!--HIMMEL-->
  <rect width="1600" height="900" fill="url(#sky)"/>
<!--diffuse Wolken-->
  <path d="M0 90
           C180 45 280 100 410 72
           C570 35 670 78 810 55
           C1010 25 1120 78 1280 50
           C1430 25 1520 55 1600 35
           L1600 0 L0 0Z" fill="#8da3aa" opacity=".22" filter="url(#blur)"/>
<!--HINTERE BERGE-->
  <path d="
    M0 175
